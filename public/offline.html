<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4f3f7" />
<title>Sem conexão — Agenda Point do Ingresso</title>
<style>
  html,body{margin:0;height:100%;background:#f4f3f7;color:#1e0b3f;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center}
  img{width:72px;height:72px;border-radius:50%;background:#fff;border:1px solid #e2dfea}
  h1{font-size:28px;letter-spacing:-.02em;margin:24px 0 8px}
  p{color:#5b5470;margin:0 auto;max-width:320px;line-height:1.6}
  button{margin-top:28px;height:44px;padding:0 20px;border-radius:6px;border:0;background:#1e0b3f;color:#fff;font-weight:500;font-size:15px}
</style>
</head>
<body>
<main>
  <div>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Você está sem conexão</h1>
    <p>A Agenda Point do Ingresso precisa de internet para mostrar dados atualizados. Verifique a conexão e tente de novo.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</main>
</body>
</html>
