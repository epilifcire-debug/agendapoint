<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#140c26" />
<title>Sem conexão — Agenda Point do Ingresso</title>
<style>
  html,body{margin:0;height:100%;background:#140c26;color:#f6f3fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(70% 60% at 50% 0%,rgba(110,40,220,.45),transparent 70%)}
  img{width:72px;height:72px;border-radius:50%;background:#fff}
  h1{font-size:28px;letter-spacing:-.02em;margin:24px 0 8px}
  p{color:#bdb3d1;margin:0 auto;max-width:320px;line-height:1.6}
  button{margin-top:28px;height:44px;padding:0 24px;border-radius:999px;border:0;background:#9b5cff;color:#140c26;font-weight:700;font-size:15px}
</style>
</head>
<body>
<main>
  <div>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Você está sem conexão</h1>
    <p>A Agenda Point do Ingresso precisa de internet para mostrar dados atualizados. Verifique a conexão e tente de novo.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</main>
</body>
</html>
